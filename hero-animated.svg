<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-label="Dafenx profile header">
  <defs>
    <linearGradient id="g" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#06b6d4;#22c55e;#8b5cf6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#22c55e;#f97316;#8b5cf6;#06b6d4" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#8b5cf6;#ec4899;#06b6d4;#f97316" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="r1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="300" rx="28" fill="#0d1117"/>
  <circle cx="180" cy="60" r="210" fill="url(#r1)">
    <animate attributeName="cx" values="180;270;180" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1180" cy="230" r="260" fill="url(#r2)">
    <animate attributeName="cx" values="1180;1080;1180" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text x="700" y="88" text-anchor="middle" fill="#f8fafc"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">
    DAFENX / BUILDING IN PUBLIC
  </text>

  <text x="700" y="160" text-anchor="middle" fill="url(#g)"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="900">
    Build systems that stay useful when reality changes.
  </text>

  <text x="700" y="208" text-anchor="middle" fill="#aab4c4"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
    AI agents · open source · systems · resilient interfaces
  </text>

  <g transform="translate(458,238)">
    <circle cx="0" cy="0" r="7" fill="#8b5cf6"/>
    <text x="18" y="6" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">measure</text>
    <circle cx="125" cy="0" r="7" fill="#06b6d4"/>
    <text x="143" y="6" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">guard</text>
    <circle cx="238" cy="0" r="7" fill="#22c55e"/>
    <text x="256" y="6" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">recover</text>
    <circle cx="372" cy="0" r="7" fill="#f97316"/>
    <text x="390" y="6" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">ship</text>
  </g>
</svg>
